# Set DB_PASSWORD and ADMIN_PASSWORD in the environment. No passwords are committed.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=barbershop;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:barber_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.cors.allowed-origins=${CORS_ORIGINS:}
app.demo-mode=${DEMO_MODE:false}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
